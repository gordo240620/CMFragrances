<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <h2 class="mb-4 text-center">
                Iniciar Sesión
            </h2>

            <div class="mb-3">

                <label>Correo</label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="loginData.correo">

            </div>

            <div class="mb-3">

                <label>Contraseña</label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="loginData.password">

            </div>

            <button
                class="btn btn-dark w-100"
                (click)="iniciarSesion()">

                Iniciar Sesión

            </button>

        </div>

    </div>

</div>
